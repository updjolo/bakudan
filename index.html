<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ソウル・シンクロ: ハードコア (波形同期パズル)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-center items-center p-4 select-none">

  <div class="max-w-md w-full bg-slate-900 p-6 rounded-2xl shadow-2xl border border-violet-900/60">
    <h1 class="text-2xl font-black text-center mb-1 text-violet-400 tracking-wider">ソウル・シンクロ</h1>
    <p class="text-xs text-center text-slate-400 mb-6">【高難易度】ふたりの操作を完璧に同期させよ！</p>

    <!-- 接続画面 -->
    <div id="setup-screen" class="space-y-4">
      <button id="btn-create" class="w-full py-3 bg-violet-600 hover:bg-violet-700 font-bold rounded-xl text-white transition shadow-lg">
        部屋を作成（ホスト＝波形マスター）
      </button>
      
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-4 text-slate-500 text-sm">または</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <div class="flex gap-2">
        <input type="text" id="join-id" maxlength="5" placeholder="5桁の部屋コード" class="flex-1 px-4 py-3 bg-slate-800 rounded-xl border border-slate-700 text-white font-mono text-center text-lg focus:outline-none focus:border-violet-500">
        <button id="btn-join" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-xl transition shadow-lg">
          参加（ゲスト＝リズムマスター）
        </button>
      </div>

      <div id="my-id-display" class="hidden p-4 bg-slate-800/80 rounded-xl text-center space-y-2 border border-slate-700">
        <p class="text-xs text-slate-400">部屋コード（相手に伝えてください）</p>
        <p id="peer-id" class="text-4xl font-mono font-black text-violet-400 tracking-wider select-all"></p>
        <p id="status-msg" class="text-sm text-violet-300 animate-pulse">相手の回線接続を待機中...</p>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden space-y-4">

      <!-- ヘッダー / タイマー -->
      <div class="flex justify-between items-center p-3 bg-slate-950 rounded-xl border border-slate-800">
        <div>
          <span class="text-xs text-slate-500 block">制限時間</span>
          <span id="timer-display" class="text-3xl font-mono font-black text-violet-400">60.0</span>
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-500 block">あなたの役割</span>
          <span id="role-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-violet-500/20 text-violet-300 border border-violet-500/30">---</span>
        </div>
      </div>

      <!-- リアルタイム波形描画領域 -->
      <div class="relative w-full bg-slate-950 rounded-xl border border-slate-800 p-2 overflow-hidden flex flex-col items-center">
        <canvas id="waveCanvas" width="380" height="160" class="w-full h-40 rounded-lg bg-slate-950"></canvas>
        <div class="absolute bottom-2 right-2 px-2 py-1 bg-slate-900/80 rounded border border-slate-700 text-[10px] text-slate-300">
          シンクロ率: <span id="sync-score" class="font-bold text-violet-400">0%</span>
        </div>
      </div>

      <!-- ホスト側操作パネル -->
      <div id="host-controls" class="hidden space-y-3 p-3 bg-slate-950 rounded-xl border border-slate-800">
        <p class="text-xs font-bold text-violet-400">🎛️ 波形コントロール（ホスト用）</p>
        <div class="space-y-2 text-xs">
          <div>
            <div class="flex justify-between text-slate-400 mb-1">
              <span>周波数（波の細かさ）</span>
              <span id="val-freq" class="font-mono text-white">5.0</span>
            </div>
            <input type="range" id="slider-freq" min="1" max="10" step="0.1" value="5" class="w-full accent-violet-500">
          </div>
          <div>
            <div class="flex justify-between text-slate-400 mb-1">
              <span>振幅（波の高さ）</span>
              <span id="val-amp" class="font-mono text-white">50</span>
            </div>
            <input type="range" id="slider-amp" min="10" max="80" step="1" value="50" class="w-full accent-violet-500">
          </div>
        </div>
      </div>

      <!-- ゲスト側操作パネル -->
      <div id="guest-controls" class="hidden space-y-3 p-3 bg-slate-950 rounded-xl border border-slate-800">
        <p class="text-xs font-bold text-cyan-400">🎛️ リズムコントロール（ゲスト用）</p>
        <div class="space-y-2 text-xs">
          <div>
            <div class="flex justify-between text-slate-400 mb-1">
              <span>位相（左右のズレ）</span>
              <span id="val-phase" class="font-mono text-white">0.0</span>
            </div>
            <input type="range" id="slider-phase" min="0" max="6.28" step="0.1" value="0" class="w-full accent-cyan-500">
          </div>
          <div>
            <div class="flex justify-between text-slate-400 mb-1">
              <span>振動速度（流れる速さ）</span>
              <span id="val-speed" class="font-mono text-white">2.0</span>
            </div>
            <input type="range" id="slider-speed" min="0.5" max="5" step="0.1" value="2" class="w-full accent-cyan-500">
          </div>
        </div>
      </div>

      <!-- 結果表示ボックス -->
      <div id="result-box" class="hidden p-4 rounded-xl text-center space-y-2 border"></div>

      <!-- アクションボタン -->
      <div>
        <button id="btn-start" class="w-full py-3 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl transition shadow-lg text-sm">
          同期実験を開始（制限時間 60秒）
        </button>
      </div>

    </div>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let isHost = false;
    let timerId = null;
    let timeLeft = 60.0;
    let isGaming = false;
    let matchCounter = 0;

    // パラメータ管理
    let myParams = { freq: 5, amp: 50, phase: 0, speed: 2 };
    let partnerParams = { freq: 5, amp: 50, phase: 0, speed: 2 };
    let targetParams = { freq: 7.2, amp: 65, phase: 2.5, speed: 3.5 };

    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');

    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const btnCreate = document.getElementById('btn-create');
    const btnJoin = document.getElementById('btn-join');
    const joinInput = document.getElementById('join-id');
    const myIdDisplay = document.getElementById('my-id-display');
    const peerIdText = document.getElementById('peer-id');
    const btnStart = document.getElementById('btn-start');
    const timerDisplay = document.getElementById('timer-display');
    const roleBadge = document.getElementById('role-badge');
    const hostControls = document.getElementById('host-controls');
    const guestControls = document.getElementById('guest-controls');
    const resultBox = document.getElementById('result-box');
    const syncScoreDisplay = document.getElementById('sync-score');

    function generateShortCode() {
      return Math.floor(10000 + Math.random() * 90000).toString();
    }

    btnCreate.addEventListener('click', () => {
      isHost = true;
      btnCreate.disabled = true;
      btnCreate.textContent = "部屋を作成中...";
      const peerId = "soul-" + generateShortCode();
      peer = new Peer(peerId);

      peer.on('open', (id) => {
        myIdDisplay.classList.remove('hidden');
        peerIdText.textContent = id.replace('soul-', '');
        btnCreate.textContent = "相手の接続待ち";
      });
      peer.on('error', () => btnCreate.click());
      peer.on('connection', (c) => { conn = c; setupConnection(); });
    });

    btnJoin.addEventListener('click', () => {
      const code = joinInput.value.trim();
      if (!code || code.length !== 5) return alert('5桁のコードを入力してください');
      isHost = false;
      btnJoin.disabled = true;
      btnJoin.textContent = "接続中...";
      peer = new Peer();
      peer.on('open', () => { conn = peer.connect("soul-" + code); setupConnection(); });
      peer.on('error', () => { alert("部屋が見つかりません"); btnJoin.disabled = false; btnJoin.textContent = "参加"; });
    });

    function setupConnection() {
      conn.on('open', () => {
        setupScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        if (isHost) {
          roleBadge.textContent = "波形マスター (ホスト)";
          hostControls.classList.remove('hidden');
        } else {
          roleBadge.textContent = "リズムマスター (ゲスト)";
          guestControls.classList.remove('hidden');
          btnStart.classList.add('hidden');
        }
        startRenderLoop();
      });
      conn.on('data', (data) => handleData(data));
    }

    // スライダー変更検知
    ['freq', 'amp', 'phase', 'speed'].forEach(key => {
      const slider = document.getElementById(`slider-${key}`);
      if (slider) {
        slider.oninput = (e) => {
          myParams[key] = parseFloat(e.target.value);
          document.getElementById(`val-${key}`).textContent = myParams[key];
          if (conn && conn.open) {
            conn.send({ type: 'PARAMS', params: myParams });
          }
        };
      }
    });

    btnStart.addEventListener('click', () => {
      if (!isHost) return;
      targetParams = {
        freq: parseFloat((Math.random() * 7 + 2).toFixed(1)),
        amp: Math.floor(Math.random() * 50 + 25),
        phase: parseFloat((Math.random() * 5 + 0.5).toFixed(1)),
        speed: parseFloat((Math.random() * 3 + 1.5).toFixed(1))
      };
      conn.send({ type: 'START', target: targetParams });
      initGame(targetParams);
    });

    function initGame(target) {
      targetParams = target;
      timeLeft = 60.0;
      isGaming = true;
      matchCounter = 0;
      resultBox.classList.add('hidden');
      btnStart.classList.add('hidden');

      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft -= 0.1;
        timerDisplay.textContent = Math.max(0, timeLeft).toFixed(1);
        if (timeLeft <= 0) {
          clearInterval(timerId);
          triggerGameOver("タイムオーバー！波形を同期できませんでした。");
        }
      }, 100);
    }

    let animTime = 0;
    function startRenderLoop() {
      function render() {
        animTime += 0.05;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 基準線
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height / 2);
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();

        // ふたりのパラメータを合成
        const activeFreq = isHost ? myParams.freq : partnerParams.freq;
        const activeAmp = isHost ? myParams.amp : partnerParams.amp;
        const activePhase = isHost ? partnerParams.phase : myParams.phase;
        const activeSpeed = isHost ? partnerParams.speed : myParams.speed;

        // 目標波形の描画（点線）
        if (isGaming) {
          ctx.strokeStyle = '#6366f1';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          for (let x = 0; x < canvas.width; x++) {
            const y = (canvas.height / 2) + Math.sin(x * 0.03 * targetParams.freq + animTime * targetParams.speed + targetParams.phase) * targetParams.amp * 0.6;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // ふたりの合成波形の描画（実線）
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 3;
        ctx.beginPath();
        let totalDiff = 0;
        for (let x = 0; x < canvas.width; x++) {
          const y = (canvas.height / 2) + Math.sin(x * 0.03 * activeFreq + animTime * activeSpeed + activePhase) * activeAmp * 0.6;
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);

          if (isGaming) {
            const targetY = (canvas.height / 2) + Math.sin(x * 0.03 * targetParams.freq + animTime * targetParams.speed + targetParams.phase) * targetParams.amp * 0.6;
            totalDiff += Math.abs(y - targetY);
          }
        }
        ctx.stroke();

        // シンクロ率の判定
        if (isGaming) {
          const maxDiff = canvas.width * 100;
          const score = Math.max(0, Math.floor(100 - (totalDiff / maxDiff) * 100));
          syncScoreDisplay.textContent = score + "%";

          if (score >= 92) {
            matchCounter++;
            if (matchCounter >= 30) { // 92%以上の状態を約3秒保持
              clearInterval(timerId);
              isGaming = false;
              showResult(true, "✨ 完全同期成功！心がひとつになりました！ ✨");
              if (isHost) conn.send({ type: 'WIN' });
            }
          } else {
            matchCounter = Math.max(0, matchCounter - 1);
          }
        }

        requestAnimationFrame(render);
      }
      render();
    }

    function triggerGameOver(msg) {
      isGaming = false;
      showResult(false, `💥 実験失敗: ${msg}`);
      if (isHost) conn.send({ type: 'GAMEOVER', msg });
    }

    function showResult(success, msg) {
      resultBox.classList.remove('hidden');
      resultBox.className = `p-4 rounded-xl text-center font-bold text-sm ${success ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-rose-500/20 text-rose-300 border-rose-500/40'}`;
      resultBox.textContent = msg;
      if (isHost) {
        btnStart.classList.remove('hidden');
        btnStart.textContent = "もう一度同期実験を行う";
      }
    }

    function handleData(data) {
      if (data.type === 'PARAMS') {
        partnerParams = data.params;
      } else if (data.type === 'START') {
        initGame(data.target);
      } else if (data.type === 'WIN') {
        clearInterval(timerId);
        isGaming = false;
        showResult(true, "✨ 完全同期成功！心がひとつになりました！ ✨");
      } else if (data.type === 'GAMEOVER') {
        clearInterval(timerId);
        isGaming = false;
        showResult(false, `💥 実験失敗: ${data.msg}`);
      }
    }
  </script>
</body>
</html>
